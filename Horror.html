  <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Horror Jumpscare Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    overflow:hidden;
    background:black;
    color:white;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    background:
    radial-gradient(circle at center, #111 0%, #000 80%);
}

#room{
    position:absolute;
    width:100%;
    height:100%;
    background:url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1974&auto=format&fit=crop') center/cover;
    filter:brightness(0.18);
    transition:0.2s;
}

#flashlight{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.1) 40%, rgba(0,0,0,0.96) 75%);
    mix-blend-mode:screen;
    transform:translate(-50%,-50%);
}

#message{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:24px;
    letter-spacing:3px;
    text-shadow:0 0 10px red;
    animation:flicker 1s infinite;
}

@keyframes flicker{
    0%{opacity:1;}
    50%{opacity:0.4;}
    100%{opacity:1;}
}

#timer{
    position:absolute;
    top:20px;
    right:20px;
    font-size:22px;
    color:red;
}

#monster{
    position:absolute;
    width:250px;
    bottom:40px;
    left:65%;
    opacity:0;
    transition:0.2s;
    filter:brightness(0.4);
}

#jumpscare{
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:0.15s;
}

#jumpscare img{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:shake 0.08s infinite;
}

@keyframes shake{
    0%{transform:translate(2px,2px);}
    25%{transform:translate(-2px,-2px);}
    50%{transform:translate(3px,-1px);}
    75%{transform:translate(-3px,2px);}
    100%{transform:translate(1px,-2px);}
}

#blood{
    position:fixed;
    inset:0;
    background:red;
    opacity:0;
    pointer-events:none;
    z-index:998;
}

#startScreen{
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:1000;
}

#startScreen h1{
    color:red;
    font-size:60px;
    margin-bottom:20px;
    text-shadow:0 0 20px red;
}

#startBtn{
    padding:15px 40px;
    border:none;
    background:red;
    color:white;
    font-size:22px;
    cursor:pointer;
    border-radius:10px;
    transition:0.2s;
}

#startBtn:hover{
    transform:scale(1.1);
    background:darkred;
}

#warning{
    margin-top:20px;
    color:#888;
}
</style>
</head>

<body>

<div id="startScreen">
    <h1>DONT LOOK BACK</h1>
    <button id="startBtn">START GAME</button>
    <div id="warning">pakai headset untuk pengalaman maksimal</div>
</div>

<div id="game">

    <div id="room"></div>

    <img id="monster"
    src="https://i.imgur.com/6RLbK0X.png">

    <div id="flashlight"></div>

    <div id="message">
        Cari suara aneh... jangan sampai tertangkap.
    </div>

    <div id="timer">
        60
    </div>

</div>

<div id="blood"></div>

<div id="jumpscare">
    <img src="https://i.imgur.com/Q6aZ3Xl.jpg">
</div>

<audio id="ambient" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_b4cfa7f6fd.mp3?filename=dark-ambient-113997.mp3">
</audio>

<audio id="scary">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4aeb6f7f1e.mp3?filename=horror-scream-113219.mp3">
</audio>

<script>

const flashlight = document.getElementById("flashlight");
const monster = document.getElementById("monster");
const jumpscare = document.getElementById("jumpscare");
const scary = document.getElementById("scary");
const ambient = document.getElementById("ambient");
const blood = document.getElementById("blood");
const timerText = document.getElementById("timer");
const room = document.getElementById("room");
const startBtn = document.getElementById("startBtn");
const startScreen = document.getElementById("startScreen");

let gameStarted = false;
let time = 60;
let monsterVisible = false;

document.addEventListener("mousemove",(e)=>{
    flashlight.style.left = e.clientX+"px";
    flashlight.style.top = e.clientY+"px";
});

document.addEventListener("touchmove",(e)=>{
    flashlight.style.left = e.touches[0].clientX+"px";
    flashlight.style.top = e.touches[0].clientY+"px";
});

startBtn.onclick = ()=>{

    startScreen.style.display = "none";

    ambient.volume = 0.5;
    ambient.play();

    gameStarted = true;

    startGame();
}

function startGame(){

    const countdown = setInterval(()=>{

        time--;
        timerText.innerText = time;

        if(time <= 0){
            clearInterval(countdown);
            winGame();
        }

    },1000);

    setInterval(()=>{

        if(!monsterVisible){

            showMonster();

        }

    },3000);

}

function showMonster(){

    monsterVisible = true;

    const randomX = Math.random()*70+10;
    const randomScale = Math.random()*0.6+0.7;

    monster.style.left = randomX+"%";
    monster.style.transform = `scale(${randomScale})`;

    monster.style.opacity = 0.8;

    room.style.filter = "brightness(0.12)";

    setTimeout(()=>{

        if(monsterVisible){

            triggerJumpscare();

        }

    },1500);

}

monster.onclick = ()=>{

    monsterVisible = false;
    monster.style.opacity = 0;

    room.style.filter = "brightness(0.18)";

}

function triggerJumpscare(){

    scary.volume = 1;
    scary.play();

    jumpscare.style.opacity = 1;
    jumpscare.style.pointerEvents = "all";

    blood.style.opacity = 0.5;

    navigator.vibrate([200,100,200,100,300]);

    document.body.style.background = "red";

    setTimeout(()=>{

        alert("KAMU DITANGKAP...");

        location.reload();

    },1800);

}

function winGame(){

    ambient.pause();

    alert("KAMU BERHASIL BERTAHAN HIDUP.");

    location.reload();

}

setInterval(()=>{

    if(gameStarted){

        const random = Math.random();

        if(random > 0.7){

            document.body.style.filter = "brightness(1.2)";

            setTimeout(()=>{
                document.body.style.filter = "brightness(1)";
            },100);

        }

    }

},2000);

</script>

</body>
</html>
