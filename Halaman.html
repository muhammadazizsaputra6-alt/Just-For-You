<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Company Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    overflow:hidden;
}

/* BACKGROUND GLOW */

body::before{
    content:'';
    position:absolute;
    width:300px;
    height:300px;
    background:#00e5ff;
    filter:blur(140px);
    top:-100px;
    left:-100px;
}

body::after{
    content:'';
    position:absolute;
    width:300px;
    height:300px;
    background:#ff0077;
    filter:blur(140px);
    bottom:-100px;
    right:-100px;
}

/* CONTAINER */

.container{
    position:relative;
    width:400px;
    min-height:520px;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* BOX */

.box{
    position:relative;
    width:100%;
    background:#111827;
    border-radius:25px;
    padding:40px;
    box-shadow:
    0 0 25px rgba(0,0,0,0.5),
    0 0 50px rgba(0,0,0,0.2);
    overflow:hidden;
}

/* BORDER ANIMATION */

.box::before{
    content:'';
    position:absolute;
    inset:-3px;
    background:linear-gradient(
        45deg,
        #00e5ff,
        #ff0077,
        #00e5ff
    );
    z-index:-2;
    animation:animate 5s linear infinite;
}

.box::after{
    content:'';
    position:absolute;
    inset:3px;
    background:#111827;
    border-radius:22px;
    z-index:-1;
}

@keyframes animate{
    0%{
        filter:hue-rotate(0deg);
    }

    100%{
        filter:hue-rotate(360deg);
    }
}

/* TITLE */

.title{
    text-align:center;
    color:white;
    font-size:30px;
    margin-bottom:25px;
    letter-spacing:2px;
}

/* FORM */

.form{
    display:none;
    flex-direction:column;
}

.form.active{
    display:flex;
}

/* INPUT */

.inputBox{
    width:100%;
    margin-bottom:18px;
}

.inputBox input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:15px;
    transition:0.3s;
}

.inputBox input:focus{
    box-shadow:0 0 15px #00e5ff;
}

/* BUTTON */

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#00e5ff,#00bcd4);
    color:black;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

.btn:hover{
    transform:scale(1.03);
}

/* LINKS */

.links{
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    font-size:14px;
}

.links a{
    color:#ff2d92;
    text-decoration:none;
    cursor:pointer;
    transition:0.3s;
}

.links a:hover{
    color:#00e5ff;
}

/* COMPANY TEXT */

.company{
    text-align:center;
    color:#00e5ff;
    margin-bottom:25px;
    font-size:14px;
    letter-spacing:2px;
}

/* MESSAGE */

.message{
    margin-top:15px;
    text-align:center;
    color:#00ff95;
    font-size:14px;
}

.error{
    color:#ff4d4d;
}

</style>
</head>
<body>

<div class="container">

    <div class="box">

        <div class="company">
            INNOVATE IN CODE, FORTIFY IN SECURITY
        </div>

        <!-- LOGIN -->
        <form class="form active" id="loginForm">

            <h2 class="title">LOGIN</h2>

            <div class="inputBox">
                <input type="email" id="loginEmail" placeholder="Masukkan Email" required>
            </div>

            <div class="inputBox">
                <input type="password" id="loginPassword" placeholder="Masukkan Password" required>
            </div>

            <button type="submit" class="btn">
                Sign In
            </button>

            <div class="links">
                <a onclick="showForgot()">
                    Forgot Password?
                </a>

                <a onclick="showRegister()">
                    Sign Up
                </a>
            </div>

            <div class="message" id="loginMessage"></div>

        </form>

        <!-- REGISTER -->
        <form class="form" id="registerForm">

            <h2 class="title">DAFTAR</h2>

            <div class="inputBox">
                <input type="email" id="registerEmail" placeholder="Masukkan Email" required>
            </div>

            <div class="inputBox">
                <input type="password" id="registerPassword" placeholder="Masukkan Password" required>
            </div>

            <div class="inputBox">
                <input type="password" id="registerConfirmPassword" placeholder="Masukkan Password Lagi" required>
            </div>

            <button type="submit" class="btn">
                Simpan Akun
            </button>

            <div class="links">
                <a onclick="showLogin()">
                    Sudah punya akun?
                </a>
            </div>

            <div class="message" id="registerMessage"></div>

        </form>

        <!-- FORGOT PASSWORD -->
        <form class="form" id="forgotForm">

            <h2 class="title">FORGOT</h2>

            <div class="inputBox">
                <input type="email" id="forgotEmail" placeholder="Masukkan Email Anda" required>
            </div>

            <button type="submit" class="btn">
                Reset Password
            </button>

            <div class="links">
                <a onclick="showLogin()">
                    Kembali Login
                </a>
            </div>

            <div class="message" id="forgotMessage"></div>

        </form>

    </div>

</div>

<script>

/* FORM */

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const forgotForm = document.getElementById("forgotForm");

/* SHOW FORM */

function showLogin(){
    loginForm.classList.add("active");
    registerForm.classList.remove("active");
    forgotForm.classList.remove("active");
}

function showRegister(){
    registerForm.classList.add("active");
    loginForm.classList.remove("active");
    forgotForm.classList.remove("active");
}

function showForgot(){
    forgotForm.classList.add("active");
    loginForm.classList.remove("active");
    registerForm.classList.remove("active");
}

/* REGISTER */

registerForm.addEventListener("submit", function(e){

    e.preventDefault();

    let email = document.getElementById("registerEmail").value;
    let password = document.getElementById("registerPassword").value;
    let confirmPassword = document.getElementById("registerConfirmPassword").value;

    let message = document.getElementById("registerMessage");

    if(password !== confirmPassword){

        message.innerHTML = "Password tidak sama!";
        message.classList.add("error");

        return;
    }

    /* SIMPAN KE LOCAL STORAGE */

    localStorage.setItem("userEmail", email);
    localStorage.setItem("userPassword", password);

    message.classList.remove("error");
    message.innerHTML = "Akun berhasil dibuat!";

    setTimeout(() => {

        alert("Daftar berhasil, silahkan login!");

        showLogin();

    },1000);

});

/* LOGIN */

loginForm.addEventListener("submit", function(e){

    e.preventDefault();

    let email = document.getElementById("loginEmail").value;
    let password = document.getElementById("loginPassword").value;

    let savedEmail = localStorage.getItem("userEmail");
    let savedPassword = localStorage.getItem("userPassword");

    let message = document.getElementById("loginMessage");

    if(email === savedEmail && password === savedPassword){

        message.classList.remove("error");
        message.innerHTML = "Login berhasil!";

        setTimeout(() => {

            /* HALAMAN SETELAH LOGIN */

            document.body.innerHTML = `
            
            <div style="
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0f172a;
            color:white;
            flex-direction:column;
            ">

                <h1 style="
                font-size:45px;
                margin-bottom:20px;
                color:#00e5ff;
                ">
                Selamat Datang
                </h1>

                <p style="
                font-size:18px;
                color:#ccc;
                ">
                Anda berhasil login ke sistem perusahaan
                </p>

                <button onclick="logout()" style="
                margin-top:30px;
                padding:15px 30px;
                border:none;
                border-radius:12px;
                background:#00e5ff;
                cursor:pointer;
                font-weight:bold;
                ">
                Logout
                </button>

            </div>
            
            `;

        },1000);

    }else{

        message.innerHTML = "Email atau password salah!";
        message.classList.add("error");

    }

});

/* FORGOT PASSWORD */

forgotForm.addEventListener("submit", function(e){

    e.preventDefault();

    let email = document.getElementById("forgotEmail").value;

    let savedEmail = localStorage.getItem("userEmail");

    let message = document.getElementById("forgotMessage");

    if(email === savedEmail){

        message.classList.remove("error");
        message.innerHTML = "Link reset password dikirim!";

    }else{

        message.innerHTML = "Email tidak ditemukan!";
        message.classList.add("error");

    }

});

/* LOGOUT */

function logout(){

    location.reload();

}

</script>

</body>
</html>
