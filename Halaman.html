<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Company Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    overflow:hidden;
    position:relative;
}

/* BACKGROUND EFFECT */

body::before{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    background:#00e5ff;
    border-radius:50%;
    filter:blur(150px);
    top:-100px;
    left:-100px;
}

body::after{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    background:#ff0077;
    border-radius:50%;
    filter:blur(150px);
    bottom:-100px;
    right:-100px;
}

/* CONTAINER */

.container{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    z-index:2;
}

/* BOX */

.box{
    position:relative;
    width:100%;
    max-width:400px;
    background:#111827;
    border-radius:25px;
    padding:40px;
    overflow:hidden;
    box-shadow:
    0 0 25px rgba(0,0,0,0.5),
    0 0 60px rgba(0,0,0,0.3);
}

/* ANIMATED BORDER */

.box::before{
    content:'';
    position:absolute;
    inset:-3px;
    background:linear-gradient(
        45deg,
        #00e5ff,
        #ff0077,
        #00e5ff
    );
    animation:borderAnim 5s linear infinite;
    z-index:-2;
    pointer-events:none;
}

.box::after{
    content:'';
    position:absolute;
    inset:4px;
    background:#111827;
    border-radius:22px;
    z-index:-1;
    pointer-events:none;
}

@keyframes borderAnim{
    0%{
        filter:hue-rotate(0deg);
    }

    100%{
        filter:hue-rotate(360deg);
    }
}

/* COMPANY */

.company{
    text-align:center;
    color:#00e5ff;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:25px;
}

/* FORM */

.form{
    display:none;
    flex-direction:column;
    position:relative;
    z-index:10;
}

.form.active{
    display:flex;
}

/* TITLE */

.title{
    color:white;
    text-align:center;
    font-size:32px;
    margin-bottom:30px;
    letter-spacing:2px;
}

/* INPUT */

.inputBox{
    margin-bottom:18px;
}

.inputBox input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:15px;
    transition:0.3s;
}

.inputBox input:focus{
    box-shadow:0 0 15px #00e5ff;
}

/* BUTTON */

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#00e5ff,#00bcd4);
    color:black;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.03);
}

/* LINKS */

.links{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.links a{
    color:#ff2d92;
    text-decoration:none;
    font-size:14px;
    cursor:pointer;
    transition:0.3s;
    position:relative;
    z-index:100;
}

.links a:hover{
    color:#00e5ff;
}

/* MESSAGE */

.message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
    color:#00ff88;
}

.error{
    color:#ff4d4d;
}

/* SUCCESS PAGE */

.successPage{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    text-align:center;
}

.successPage h1{
    color:#00e5ff;
    font-size:40px;
    margin-bottom:15px;
}

.successPage p{
    color:#ccc;
    font-size:18px;
}

/* MOBILE */

@media(max-width:500px){

    .box{
        padding:30px 20px;
    }

    .title{
        font-size:28px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="box">

        <div class="company">
            INNOVATE IN CODE, FORTIFY IN SECURITY
        </div>

        <!-- LOGIN -->

        <form class="form active" id="loginForm">

            <h2 class="title">LOGIN</h2>

            <div class="inputBox">
                <input type="email" id="loginEmail" placeholder="Masukkan Email" required>
            </div>

            <div class="inputBox">
                <input type="password" id="loginPassword" placeholder="Masukkan Password" required>
            </div>

            <button type="submit" class="btn">
                Sign In
            </button>

            <div class="links">
                <a onclick="showForgot()">
                    Forgot Password?
                </a>

                <a onclick="showRegister()">
                    Sign Up
                </a>
            </div>

            <div class="message" id="loginMessage"></div>

        </form>

        <!-- REGISTER -->

        <form class="form" id="registerForm">

            <h2 class="title">DAFTAR</h2>

            <div class="inputBox">
                <input type="email" id="registerEmail" placeholder="Masukkan Email" required>
            </div>

            <div class="inputBox">
                <input type="password" id="registerPassword" placeholder="Masukkan Password" required>
            </div>

            <div class="inputBox">
                <input type="password" id="registerConfirmPassword" placeholder="Masukkan Password Lagi" required>
            </div>

            <button type="submit" class="btn">
                Simpan Akun
            </button>

            <div class="links">
                <a onclick="showLogin()">
                    Sudah punya akun?
                </a>
            </div>

            <div class="message" id="registerMessage"></div>

        </form>

        <!-- FORGOT PASSWORD -->

        <form class="form" id="forgotForm">

            <h2 class="title">FORGOT</h2>

            <div class="inputBox">
                <input type="email" id="forgotEmail" placeholder="Masukkan Email Anda" required>
            </div>

            <button type="submit" class="btn">
                Reset Password
            </button>

            <div class="links">
                <a onclick="showLogin()">
                    Kembali Login
                </a>
            </div>

            <div class="message" id="forgotMessage"></div>

        </form>

    </div>

</div>

<script>

/* FORM */

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const forgotForm = document.getElementById("forgotForm");

/* SHOW LOGIN */

function showLogin(){

    loginForm.classList.add("active");

    registerForm.classList.remove("active");

    forgotForm.classList.remove("active");

}

/* SHOW REGISTER */

function showRegister(){

    registerForm.classList.add("active");

    loginForm.classList.remove("active");

    forgotForm.classList.remove("active");

}

/* SHOW FORGOT */

function showForgot(){

    forgotForm.classList.add("active");

    loginForm.classList.remove("active");

    registerForm.classList.remove("active");

}

/* REGISTER */

registerForm.addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("registerEmail").value;

    const password = document.getElementById("registerPassword").value;

    const confirmPassword = document.getElementById("registerConfirmPassword").value;

    const message = document.getElementById("registerMessage");

    if(password !== confirmPassword){

        message.innerHTML = "Password tidak sama!";
        message.classList.add("error");

        return;
    }

    localStorage.setItem("userEmail", email);

    localStorage.setItem("userPassword", password);

    message.classList.remove("error");

    message.innerHTML = "Akun berhasil dibuat!";

    setTimeout(() => {

        alert("Daftar berhasil, silahkan login!");

        showLogin();

    },1000);

});

/* LOGIN */

loginForm.addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("loginEmail").value;

    const password = document.getElementById("loginPassword").value;

    const savedEmail = localStorage.getItem("userEmail");

    const savedPassword = localStorage.getItem("userPassword");

    const message = document.getElementById("loginMessage");

    if(email === savedEmail && password === savedPassword){

        message.classList.remove("error");

        message.innerHTML = "Login berhasil!";

        setTimeout(() => {

            document.body.innerHTML = `

            <div class="successPage">

                <h1>Selamat Datang</h1>

                <p>Anda berhasil login ke sistem perusahaan</p>

                <button onclick="logout()" class="btn" style="margin-top:30px; width:200px;">
                    Logout
                </button>

            </div>

            `;

        },1000);

    }else{

        message.innerHTML = "Email atau password salah!";

        message.classList.add("error");

    }

});

/* FORGOT */

forgotForm.addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("forgotEmail").value;

    const savedEmail = localStorage.getItem("userEmail");

    const message = document.getElementById("forgotMessage");

    if(email === savedEmail){

        message.classList.remove("error");

        message.innerHTML = "Link reset password berhasil dikirim!";

    }else{

        message.innerHTML = "Email tidak ditemukan!";

        message.classList.add("error");

    }

});

/* LOGOUT */

function logout(){

    location.reload();

}

</script>

</body>
</html>
