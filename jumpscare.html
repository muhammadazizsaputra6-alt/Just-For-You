<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS HORROR GAME</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    overflow:hidden;
    background:black;
}

/* GAME */

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:black;
}

/* WORLD */

#world{
    position:absolute;
    width:3000px;
    height:3000px;
    background:
    radial-gradient(circle,#111 0%,#000 90%);
}

/* FLOOR */

.floor{
    position:absolute;
    background:#1a1a1a;
    border:2px solid #222;
}

/* PLAYER */

#player{
    width:40px;
    height:40px;
    border-radius:50%;
    background:white;
    position:absolute;
    z-index:5;
    box-shadow:0 0 20px white;
}

/* FLASHLIGHT */

#flashlight{
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    pointer-events:none;
    z-index:50;
    background:
    radial-gradient(circle,
    rgba(255,255,255,0.3) 0%,
    rgba(255,255,255,0.08) 35%,
    rgba(0,0,0,0.96) 75%);
    mix-blend-mode:screen;
}

/* GHOST */

#ghost{
    width:180px;
    position:absolute;
    z-index:4;
    transition:0.1s linear;
    filter:brightness(0.7);
}

/* KEY */

.key{
    width:40px;
    height:40px;
    background:gold;
    border-radius:50%;
    position:absolute;
    box-shadow:0 0 20px gold;
}

/* UI */

#ui{
    position:fixed;
    top:20px;
    left:20px;
    color:red;
    z-index:100;
    font-size:24px;
    text-shadow:0 0 10px red;
}

/* START */

#start{
    position:fixed;
    inset:0;
    background:black;
    z-index:999;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#title{
    color:red;
    font-size:70px;
    text-shadow:0 0 25px red;
    margin-bottom:20px;
}

#play{
    padding:15px 40px;
    border:none;
    background:red;
    color:white;
    font-size:22px;
    border-radius:12px;
    cursor:pointer;
}

#info{
    margin-top:20px;
    color:#666;
}

/* JUMPSCARE */

#jumpscare{
    position:fixed;
    inset:0;
    z-index:1000;
    opacity:0;
    pointer-events:none;
    transition:0.1s;
}

#jumpscare img{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:shake .07s infinite;
}

/* BLOOD */

#blood{
    position:fixed;
    inset:0;
    background:red;
    opacity:0;
    pointer-events:none;
    z-index:999;
}

/* SHAKE */

@keyframes shake{
    0%{transform:translate(2px,2px);}
    25%{transform:translate(-2px,-2px);}
    50%{transform:translate(4px,-1px);}
    75%{transform:translate(-4px,2px);}
    100%{transform:translate(1px,-2px);}
}

</style>
</head>

<body>

<!-- START -->

<div id="start">

    <div id="title">
        DONT LOOK BACK
    </div>

    <button id="play">
        START GAME
    </button>

    <div id="info">
        cari 3 kunci lalu keluar hidup-hidup
    </div>

</div>

<!-- UI -->

<div id="ui">
    Kunci : <span id="count">0</span>/3
</div>

<!-- GAME -->

<div id="game">

    <div id="world">

        <div class="floor"
        style="left:0;top:0;width:3000px;height:3000px;"></div>

        <!-- PLAYER -->

        <div id="player"></div>

        <!-- GHOST -->

        <img id="ghost"
        src="https://i.imgur.com/Q6aZ3Xl.png">

        <!-- KEYS -->

        <div class="key"
        style="left:600px;top:900px;"></div>

        <div class="key"
        style="left:1900px;top:1300px;"></div>

        <div class="key"
        style="left:2400px;top:2400px;"></div>

    </div>

</div>

<!-- FLASHLIGHT -->

<div id="flashlight"></div>

<!-- EFFECT -->

<div id="blood"></div>

<div id="jumpscare">

<img src="https://i.imgur.com/Q6aZ3Xl.jpg">

</div>

<!-- AUDIO -->

<audio id="ambient" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_b4cfa7f6fd.mp3?filename=dark-ambient-113997.mp3">
</audio>

<audio id="scream">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4aeb6f7f1e.mp3?filename=horror-scream-113219.mp3">
</audio>

<script>

/* ELEMENT */

const player = $("#player");
const ghost = $("#ghost");
const world = $("#world");
const flashlight = $("#flashlight");

const ambient = $("#ambient")[0];
const scream = $("#scream")[0];

let px = 1500;
let py = 1500;

let gx = 1000;
let gy = 1000;

let speed = 8;

let collected = 0;

/* START */

$("#play").click(function(){

    $("#start").fadeOut(500);

    ambient.volume = 0.5;
    ambient.play();

});

/* MOVE PLAYER */

const keys = {};

$(document).keydown(function(e){

    keys[e.key.toLowerCase()] = true;

});

$(document).keyup(function(e){

    keys[e.key.toLowerCase()] = false;

});

/* LOOP */

setInterval(()=>{

    /* PLAYER MOVEMENT */

    if(keys["w"]) py -= speed;
    if(keys["s"]) py += speed;
    if(keys["a"]) px -= speed;
    if(keys["d"]) px += speed;

    /* PLAYER */

    player.css({
        left:px+"px",
        top:py+"px"
    });

    /* CAMERA */

    world.css({
        transform:`translate(${-px + window.innerWidth/2}px,${-py + window.innerHeight/2}px)`
    });

    /* FLASHLIGHT */

    flashlight.css({
        left:window.innerWidth/2 - 175 + "px",
        top:window.innerHeight/2 - 175 + "px"
    });

    /* GHOST AI */

    let dx = px - gx;
    let dy = py - gy;

    let dist = Math.sqrt(dx*dx + dy*dy);

    /* HANTU NGELIAT */

    if(dist < 700){

        gx += dx / dist * 3;
        gy += dy / dist * 3;

    }

    /* HANTU JALAN */

    ghost.css({
        left:gx+"px",
        top:gy+"px"
    });

    /* KALAU KETAHUAN */

    if(dist < 250){

        speed = 4;

        $("#ui").text("LARI... DIA MELIHATMU");

    }

    /* JUMPSCARE */

    if(dist < 100){

        scream.play();

        $("#blood").css("opacity","0.5");

        $("#jumpscare").css({
            opacity:"1",
            pointerEvents:"all"
        });

        navigator.vibrate([300,100,300]);

        setTimeout(()=>{

            alert("KAMU MATI");

            location.reload();

        },1800);

    }

    /* KEY */

    $(".key").each(function(){

        let kx = parseInt($(this).css("left"));
        let ky = parseInt($(this).css("top"));

        let kdist = Math.sqrt((px-kx)**2 + (py-ky)**2);

        if(kdist < 80){

            $(this).remove();

            collected++;

            $("#count").text(collected);

            if(collected >= 3){

                ambient.pause();

                alert("KAMU BERHASIL KELUAR");

                location.reload();

            }

        }

    });

},20);

/* RANDOM LIGHT FLICKER */

setInterval(()=>{

    $("body").css("filter","brightness(1.3)");

    setTimeout(()=>{

        $("body").css("filter","brightness(1)");

    },100);

},3000);

</script>

</body>
</html>
