<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DONT LOOK BACK</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

/* GAME */

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:black;
}

/* MAP */

#map{
    position:absolute;
    width:2200px;
    height:2200px;
    background:
    radial-gradient(circle at center,#111 0%,#000 90%);
}

/* FLOOR */

.floor{
    position:absolute;
    background:#151515;
    border:2px solid #222;
}

/* WALL */

.wall{
    position:absolute;
    background:#000;
}

/* PLAYER */

#player{
    width:40px;
    height:40px;
    background:white;
    border-radius:50%;
    position:absolute;
    z-index:5;
    box-shadow:0 0 20px white;
}

/* FLASHLIGHT */

#flashlight{
    position:fixed;
    width:320px;
    height:320px;
    border-radius:50%;
    pointer-events:none;
    background:
    radial-gradient(circle,
    rgba(255,255,255,0.3) 0%,
    rgba(255,255,255,0.1) 30%,
    rgba(0,0,0,0.95) 75%);
    mix-blend-mode:screen;
    z-index:20;
}

/* GHOST */

#ghost{
    width:120px;
    position:absolute;
    z-index:4;
    transition:0.15s linear;
    filter:brightness(0.5);
}

/* KEY */

.key{
    width:35px;
    height:35px;
    background:gold;
    border-radius:50%;
    position:absolute;
    box-shadow:0 0 15px gold;
}

/* UI */

#ui{
    position:fixed;
    top:15px;
    left:15px;
    color:red;
    z-index:100;
    font-size:22px;
    text-shadow:0 0 10px red;
}

/* START */

#startScreen{
    position:fixed;
    inset:0;
    background:black;
    z-index:999;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#title{
    color:red;
    font-size:65px;
    margin-bottom:20px;
    text-shadow:0 0 20px red;
    animation:flicker 1s infinite;
}

#startBtn{
    padding:15px 40px;
    font-size:22px;
    border:none;
    border-radius:12px;
    background:red;
    color:white;
    cursor:pointer;
}

#warning{
    margin-top:20px;
    color:#666;
}

/* JUMPSCARE */

#jumpscare{
    position:fixed;
    inset:0;
    z-index:1000;
    opacity:0;
    pointer-events:none;
    transition:0.1s;
}

#jumpscare img{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:shake .08s infinite;
}

/* BLOOD */

#blood{
    position:fixed;
    inset:0;
    background:red;
    opacity:0;
    z-index:999;
    pointer-events:none;
}

/* EFFECT */

@keyframes flicker{
    0%{opacity:1;}
    50%{opacity:0.5;}
    100%{opacity:1;}
}

@keyframes shake{
    0%{transform:translate(2px,2px);}
    25%{transform:translate(-2px,-2px);}
    50%{transform:translate(3px,-1px);}
    75%{transform:translate(-3px,2px);}
    100%{transform:translate(1px,-2px);}
}

</style>
</head>

<body>

<!-- START -->

<div id="startScreen">

    <div id="title">
        DONT LOOK BACK
    </div>

    <button id="startBtn">
        START GAME
    </button>

    <div id="warning">
        cari 3 kunci dan hindari hantu
    </div>

</div>

<!-- UI -->

<div id="ui">
    Kunci : <span id="keyCount">0</span>/3
</div>

<!-- GAME -->

<div id="game">

    <div id="map">

        <!-- ROOM -->

        <div class="floor" style="left:0;top:0;width:2200px;height:2200px;"></div>

        <!-- PLAYER -->

        <div id="player"></div>

        <!-- GHOST -->

        <img id="ghost"
        src="https://i.imgur.com/6RLbK0X.png">

        <!-- KEYS -->

        <div class="key" style="left:400px;top:500px;"></div>
        <div class="key" style="left:1500px;top:700px;"></div>
        <div class="key" style="left:1800px;top:1600px;"></div>

    </div>

</div>

<!-- FLASHLIGHT -->

<div id="flashlight"></div>

<!-- EFFECT -->

<div id="blood"></div>

<div id="jumpscare">
    <img src="https://i.imgur.com/Q6aZ3Xl.jpg">
</div>

<!-- AUDIO -->

<audio id="ambient" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_b4cfa7f6fd.mp3?filename=dark-ambient-113997.mp3">
</audio>

<audio id="scary">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4aeb6f7f1e.mp3?filename=horror-scream-113219.mp3">
</audio>

<script>

/* ELEMENT */

const player = $("#player");
const ghost = $("#ghost");
const map = $("#map");
const flashlight = $("#flashlight");
const scary = $("#scary")[0];
const ambient = $("#ambient")[0];
const jumpscare = $("#jumpscare");
const blood = $("#blood");

let px = 1100;
let py = 1100;

let gx = 900;
let gy = 900;

let speed = 7;

let keys = {};

let collected = 0;

/* START */

$("#startBtn").click(function(){

    $("#startScreen").fadeOut(500);

    ambient.volume = 0.5;
    ambient.play();

});

/* MOVE */

$(document).keydown(function(e){

    if(e.key=="w") py-=speed;
    if(e.key=="s") py+=speed;
    if(e.key=="a") px-=speed;
    if(e.key=="d") px+=speed;

});

/* LOOP */

setInterval(()=>{

    /* PLAYER */

    player.css({
        left:px+"px",
        top:py+"px"
    });

    /* CAMERA */

    $("#map").css({
        transform:`translate(${-px+window.innerWidth/2}px,${-py+window.innerHeight/2}px)`
    });

    /* FLASHLIGHT */

    flashlight.css({
        left:window.innerWidth/2+"px",
        top:window.innerHeight/2+"px"
    });

    /* GHOST AI */

    let dx = px-gx;
    let dy = py-gy;

    let dist = Math.sqrt(dx*dx+dy*dy);

    gx += dx/dist*2;
    gy += dy/dist*2;

    ghost.css({
        left:gx+"px",
        top:gy+"px"
    });

    /* DETECT */

    if(dist < 120){

        jumpscare.css({
            opacity:"1",
            pointerEvents:"all"
        });

        blood.css("opacity","0.5");

        scary.play();

        navigator.vibrate([300,100,300]);

        setTimeout(()=>{

            alert("KAMU DITANGKAP HANTU");

            location.reload();

        },1800);

    }

    /* KEY */

    $(".key").each(function(){

        let kx = parseInt($(this).css("left"));
        let ky = parseInt($(this).css("top"));

        let kdist = Math.sqrt((px-kx)**2+(py-ky)**2);

        if(kdist < 80){

            $(this).remove();

            collected++;

            $("#keyCount").text(collected);

            if(collected >= 3){

                ambient.pause();

                alert("KAMU BERHASIL KELUAR");

                location.reload();

            }

        }

    });

},30);

/* RANDOM FLICKER */

setInterval(()=>{

    $("body").css("filter","brightness(1.2)");

    setTimeout(()=>{

        $("body").css("filter","brightness(1)");

    },100);

},3000);

</script>

</body>
</html>
