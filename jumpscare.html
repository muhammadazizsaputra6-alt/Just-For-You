<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DONT LOOK BACK</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    overflow:hidden;
    background:black;
}

/* GAME */

#game{
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;
    background:black;
}

/* WORLD */

#world{
    width:3500px;
    height:3500px;
    position:absolute;
    background:
    radial-gradient(circle,#111 0%,#000 90%);
}

/* PLAYER */

#player{
    width:40px;
    height:40px;
    border-radius:50%;
    background:white;
    position:absolute;
    z-index:5;
    box-shadow:0 0 20px white;
}

/* FLASHLIGHT */

#flashlight{
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    pointer-events:none;
    z-index:100;
    background:
    radial-gradient(circle,
    rgba(255,255,255,0.3) 0%,
    rgba(255,255,255,0.08) 35%,
    rgba(0,0,0,0.97) 75%);
    mix-blend-mode:screen;
}

/* FOG */

#fog{
    position:fixed;
    inset:0;
    background:url('https://i.imgur.com/fZURsgE.png');
    opacity:0.08;
    pointer-events:none;
    z-index:90;
    animation:fogMove 20s linear infinite;
}

@keyframes fogMove{
    from{background-position:0 0;}
    to{background-position:1000px 0;}
}

/* GHOST */

.ghost{
    width:180px;
    position:absolute;
    z-index:4;
    filter:brightness(0.7);
}

/* KEY */

.key{
    width:40px;
    height:40px;
    background:gold;
    border-radius:50%;
    position:absolute;
    box-shadow:0 0 20px gold;
}

/* DOOR */

.door{
    width:120px;
    height:180px;
    background:#2b1200;
    border:5px solid #111;
    position:absolute;
}

/* UI */

#ui{
    position:fixed;
    top:20px;
    left:20px;
    z-index:200;
    color:red;
    font-size:22px;
    text-shadow:0 0 10px red;
}

/* INVENTORY */

#inventory{
    position:fixed;
    top:20px;
    right:20px;
    z-index:200;
    color:white;
    background:rgba(0,0,0,0.5);
    padding:15px;
    border:1px solid #555;
    font-size:20px;
}

/* START */

#start{
    position:fixed;
    inset:0;
    background:black;
    z-index:999;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#title{
    color:red;
    font-size:70px;
    margin-bottom:20px;
    text-shadow:0 0 25px red;
}

#play{
    padding:15px 40px;
    border:none;
    background:red;
    color:white;
    font-size:22px;
    border-radius:12px;
    cursor:pointer;
}

#info{
    margin-top:20px;
    color:#666;
}

/* JOYSTICK */

#joystick{
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    position:fixed;
    left:30px;
    bottom:30px;
    z-index:300;
    touch-action:none;
}

#stick{
    width:60px;
    height:60px;
    border-radius:50%;
    background:white;
    position:absolute;
    left:30px;
    top:30px;
}

/* CCTV */

#cctv{
    width:220px;
    height:140px;
    background:#111;
    border:3px solid #555;
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:300;
    opacity:0.7;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* BLOOD */

#blood{
    position:fixed;
    inset:0;
    background:red;
    opacity:0;
    pointer-events:none;
    z-index:998;
}

/* JUMPSCARE */

#jumpscare{
    position:fixed;
    inset:0;
    opacity:0;
    pointer-events:none;
    z-index:999;
}

#jumpscare img{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:shake .08s infinite;
}

/* SHAKE */

@keyframes shake{
    0%{transform:translate(2px,2px);}
    25%{transform:translate(-2px,-2px);}
    50%{transform:translate(4px,-1px);}
    75%{transform:translate(-4px,2px);}
    100%{transform:translate(1px,-2px);}
}

</style>
</head>

<body>

<!-- START -->

<div id="start">

    <div id="title">
        DONT LOOK BACK
    </div>

    <button id="play">
        START GAME
    </button>

    <div id="info">
        cari 3 kunci dan keluar hidup-hidup
    </div>

</div>

<!-- UI -->

<div id="ui">
    HORROR MODE
</div>

<!-- INVENTORY -->

<div id="inventory">
    🔑 <span id="keyCount">0</span>/3
    <br>
    🔋 <span id="battery">100</span>%
    <br>
    ⚡ <span id="stamina">100</span>
</div>

<!-- GAME -->

<div id="game">

    <div id="world">

        <!-- PLAYER -->

        <div id="player"></div>

        <!-- GHOST -->

        <img class="ghost"
        src="https://i.imgur.com/Q6aZ3Xl.png"
        style="left:800px;top:700px;">

        <img class="ghost"
        src="https://i.imgur.com/Q6aZ3Xl.png"
        style="left:2500px;top:1000px;">

        <img class="ghost"
        src="https://i.imgur.com/Q6aZ3Xl.png"
        style="left:3000px;top:2500px;">

        <!-- KEYS -->

        <div class="key"
        style="left:500px;top:900px;"></div>

        <div class="key"
        style="left:2100px;top:1200px;"></div>

        <div class="key"
        style="left:2900px;top:3000px;"></div>

        <!-- DOOR -->

        <div class="door"
        style="left:3300px;top:3300px;"></div>

    </div>

</div>

<!-- EFFECT -->

<div id="fog"></div>

<div id="flashlight"></div>

<div id="blood"></div>

<div id="jumpscare">

<img src="https://i.imgur.com/Q6aZ3Xl.jpg">

</div>

<!-- JOYSTICK -->

<div id="joystick">

    <div id="stick"></div>

</div>

<!-- CCTV -->

<div id="cctv">
    CCTV CAMERA
</div>

<!-- AUDIO -->

<audio id="ambient" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_b4cfa7f6fd.mp3?filename=dark-ambient-113997.mp3">
</audio>

<audio id="scream">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4aeb6f7f1e.mp3?filename=horror-scream-113219.mp3">
</audio>

<script>

/* ELEMENT */

const player = $("#player");
const world = $("#world");
const flashlight = $("#flashlight");

const ambient = $("#ambient")[0];
const scream = $("#scream")[0];

let px = 1700;
let py = 1700;

let speed = 7;

let collected = 0;

let stamina = 100;

let battery = 100;

let running = false;

/* SAVE */

if(localStorage.getItem("saveX")){

    px = parseInt(localStorage.getItem("saveX"));
    py = parseInt(localStorage.getItem("saveY"));

}

/* START */

$("#play").click(function(){

    $("#start").fadeOut(500);

    ambient.volume = 0.5;

    ambient.play();

});

/* MOVE */

const keys = {};

$(document).keydown(function(e){

    keys[e.key.toLowerCase()] = true;

    if(e.shiftKey){

        running = true;

    }

});

$(document).keyup(function(e){

    keys[e.key.toLowerCase()] = false;

    running = false;

});

/* FOOTSTEP */

const footstep = new Audio(
"https://cdn.pixabay.com/download/audio/2022/03/15/audio_8d8b1b4c7b.mp3?filename=footsteps-wood-floor-14785.mp3"
);

/* GAME LOOP */

setInterval(()=>{

    /* STAMINA */

    if(running && stamina > 0){

        speed = 14;

        stamina -= 0.4;

    }else{

        speed = 7;

        stamina += 0.2;

    }

    if(stamina > 100) stamina = 100;

    if(stamina < 0) stamina = 0;

    $("#stamina").text(Math.floor(stamina));

    /* MOVE */

    if(keys["w"]) py -= speed;
    if(keys["s"]) py += speed;
    if(keys["a"]) px -= speed;
    if(keys["d"]) px += speed;

    /* PLAYER */

    player.css({
        left:px+"px",
        top:py+"px"
    });

    /* CAMERA */

    world.css({
        transform:
        `translate(${-px + window.innerWidth/2}px,
        ${-py + window.innerHeight/2}px)`
    });

    /* FLASHLIGHT */

    flashlight.css({
        left:window.innerWidth/2 - 175 + "px",
        top:window.innerHeight/2 - 175 + "px"
    });

    /* BATTERY */

    battery -= 0.01;

    $("#battery").text(Math.floor(battery));

    if(battery < 20){

        flashlight.css("opacity","0.4");

    }

    if(battery <= 0){

        flashlight.hide();

    }

    /* FOOTSTEP */

    if(keys["w"] || keys["a"] || keys["s"] || keys["d"]){

        if(footstep.paused){

            footstep.volume = 0.2;

            footstep.play();

        }

    }else{

        footstep.pause();

    }

    /* GHOST AI */

    $(".ghost").each(function(){

        let gx = parseInt($(this).css("left"));
        let gy = parseInt($(this).css("top"));

        let dx = px - gx;
        let dy = py - gy;

        let dist = Math.sqrt(dx*dx + dy*dy);

        /* DETECT */

        if(dist < 700){

            gx += dx/dist * 2.5;
            gy += dy/dist * 2.5;

            $(this).css({
                left:gx+"px",
                top:gy+"px"
            });

        }

        /* CHASE */

        if(dist < 250){

            $("#ui").text("LARI... HANTU MELIHATMU");

            $("body").css("filter","brightness(1.2)");

        }

        /* DEAD */

        if(dist < 100){

            scream.play();

            $("#blood").css("opacity","0.5");

            $("#jumpscare").css({
                opacity:"1",
                pointerEvents:"all"
            });

            navigator.vibrate([300,100,300]);

            setTimeout(()=>{

                alert("ENDING BURUK - KAMU MATI");

                location.reload();

            },1500);

        }

    });

    /* KEY */

    $(".key").each(function(){

        let kx = parseInt($(this).css("left"));
        let ky = parseInt($(this).css("top"));

        let dist = Math.sqrt(
        (px-kx)**2 + (py-ky)**2
        );

        if(dist < 80){

            $(this).remove();

            collected++;

            $("#keyCount").text(collected);

        }

    });

    /* DOOR */

    $(".door").each(function(){

        let dx = parseInt($(this).css("left"));
        let dy = parseInt($(this).css("top"));

        let dist = Math.sqrt(
        (px-dx)**2 + (py-dy)**2
        );

        if(dist < 150){

            $("#ui").text("TEKAN E UNTUK BUKA PINTU");

        }

    });

},20);

/* OPEN DOOR */

$(document).keydown(function(e){

    if(e.key.toLowerCase()=="e"){

        if(collected >= 3){

            alert("ENDING BAIK - KAMU BERHASIL KELUAR");

            localStorage.clear();

            location.reload();

        }else{

            alert("PINTU TERKUNCI");

        }

    }

});

/* SAVE */

setInterval(()=>{

    localStorage.setItem("saveX",px);
    localStorage.setItem("saveY",py);

},2000);

/* RANDOM HORROR SOUND */

setInterval(()=>{

    if(Math.random() > 0.7){

        let ghostSound = new Audio(
        "https://cdn.pixabay.com/download/audio/2022/03/10/audio_7994d92c1d.mp3?filename=horror-ambience-110397.mp3"
        );

        ghostSound.volume = 0.3;

        ghostSound.play();

    }

},8000);

/* JOYSTICK */

let joy = document.getElementById("joystick");

joy.addEventListener("touchmove",(e)=>{

    let touch = e.touches[0];

    let rect = joy.getBoundingClientRect();

    let x = touch.clientX - rect.left - 60;

    let y = touch.clientY - rect.top - 60;

    $("#stick").css({
        left:x+"px",
        top:y+"px"
    });

    px += x * 0.05;
    py += y * 0.05;

});

/* SCREEN SHAKE */

setInterval(()=>{

    if(Math.random() > 0.95){

        $("body").css("transform","rotate(1deg)");

        setTimeout(()=>{

            $("body").css("transform","rotate(0deg)");

        },100);

    }

},3000);

</script>

</body>
</html>
