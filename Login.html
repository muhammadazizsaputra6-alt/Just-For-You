<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100%;
    min-height:100vh;
    background:#0f172a;
    overflow:hidden;
    position:relative;
}

/* BACKGROUND */

body::before{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    background:#00e5ff;
    border-radius:50%;
    filter:blur(150px);
    top:-100px;
    left:-100px;
}

body::after{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    background:#ff0077;
    border-radius:50%;
    filter:blur(150px);
    bottom:-100px;
    right:-100px;
}

/* LOGIN */

.container{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    z-index:2;
}

.box{
    position:relative;
    width:100%;
    max-width:850px;
    background:#111827;
    border-radius:30px;
    padding:55px;
    overflow:hidden;
    display:flex;
    justify-content:center;
    flex-direction:column;
    box-shadow:
    0 0 25px rgba(0,0,0,0.5),
    0 0 60px rgba(0,0,0,0.3);
}

.box::before{
    content:'';
    position:absolute;
    inset:-3px;
    background:linear-gradient(
        45deg,
        #00e5ff,
        #ff0077,
        #00e5ff
    );
    animation:borderAnim 5s linear infinite;
    z-index:-2;
}

.box::after{
    content:'';
    position:absolute;
    inset:4px;
    background:#111827;
    border-radius:22px;
    z-index:-1;
}

@keyframes borderAnim{
    100%{
        filter:hue-rotate(360deg);
    }
}

.company{
    text-align:center;
    color:#00e5ff;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:25px;
}

.form{
    display:none;
    flex-direction:column;
}

.form.active{
    display:flex;
}

.title{
    color:white;
    text-align:center;
    font-size:32px;
    margin-bottom:30px;
}

.inputBox{
    margin-bottom:18px;
}

.inputBox input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:15px;
}

.inputBox input:focus{
    box-shadow:0 0 15px #00e5ff;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#00e5ff,#00bcd4);
    color:black;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.links{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
}

.linkBtn{
    background:none;
    border:none;
    color:#ff2d92;
    font-size:14px;
    cursor:pointer;
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
    color:#00ff88;
}

.error{
    color:#ff4d4d;
}

/* DASHBOARD */

.dashboard{
    display:none;
    width:100%;
    min-height:100vh;
    position:relative;
    z-index:2;
}

/* TOPBAR */

.topbar{
    width:100%;
    height:65px;
    background:#111827;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 20px;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

/* GARIS 3 */

.menuBtn{
    font-size:38px;
    color:white;
    cursor:pointer;
    user-select:none;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    top:0;
    right:-100%;
    width:100%;
    height:100%;
    background:#111827;
    transition:0.4s;
    z-index:2000;
    padding-top:80px;
}

.sidebar.active{
    right:0;
}

/* CLOSE */

.closeBtn{
    position:absolute;
    top:10px;
    right:20px;
    font-size:45px;
    color:white;
    cursor:pointer;
}

/* MENU */

.menu button{
    width:100%;
    padding:22px;
    background:none;
    border:none;
    border-bottom:1px solid rgba(255,255,255,0.1);
    color:#00e5ff;
    font-size:20px;
    text-align:left;
    cursor:pointer;
}

.menu button:hover{
    background:#1e293b;
}

/* CONTENT */

.content{
    padding:90px 20px 20px;
}

/* PAGE */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* CARD */

.card{
    background:#111827;
    border-radius:20px;
    padding:25px;
    color:white;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.card h2{
    color:#00e5ff;
    margin-bottom:10px;
}

.card p{
    color:#d1d5db;
    line-height:1.6;
}

@media(max-width:768px){

    .box{
        width:100%;
        max-width:95%;
        padding:45px 35px;
    }

}

    /* AI DASHBOARD */

.dashboardTitle{
    margin-bottom:25px;
}

.dashboardTitle h1{
    color:#00e5ff;
    font-size:50px;
    margin-bottom:10px;
}

.dashboardTitle p{
    color:#d1d5db;
    font-size:20px;
}

.dashboardGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    margin-bottom:25px;
    width:100%;
}

.aiCard{
    background:#111827;
    border-radius:22px;
    padding:28px;
    color:white;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.05);
    min-height:150px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.aiCard h2{
    font-size:18px;
    color:#00e5ff;
    margin-bottom:15px;
}

.aiCard p{
    font-size:38px;
    font-weight:bold;
}

.online{
    width:10px;
    height:10px;
    background:#00ff88;
    border-radius:50%;
    display:inline-block;
    margin-bottom:10px;
    box-shadow:0 0 10px #00ff88;
}

.mainAiBox{
    width:115%;
    background:#111827;
    border-radius:22px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.mainAiBox h2{
    color:#00e5ff;
    margin-bottom:20px;
}
    
.chatBox{
    width:105%;
    height:220px;
    background:#0f172a;
    border-radius:15px;
    padding:15px;
    overflow-y:auto;
    margin-bottom:20px;
}

.aiMessage{
    background:#1e293b;
    color:white;
    padding:15px;
    border-radius:15px;
    width:fit-content;
    max-width:90%;
    line-height:1.5;
}

.inputAi{
    display:flex;
    gap:10px;
}

.inputAi input{
    flex:1;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
}

.inputAi button{
    padding:15px 25px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#00e5ff,#00bcd4);
    color:black;
    font-weight:bold;
    cursor:pointer;
}
    
</style>
</head>
<body>

<!-- LOGIN -->

<div class="container" id="loginContainer">

    <div class="box">

        <div class="company">
            INNOVATE IN CODE
        </div>

        <!-- LOGIN -->

        <form class="form active" id="loginForm">

            <h2 class="title">LOGIN</h2>

            <div class="inputBox">
                <input type="email" id="loginEmail" placeholder="Masukkan Email" required>
            </div>

            <div class="inputBox">
                <input type="password" id="loginPassword" placeholder="Masukkan Password" required>
            </div>

            <button type="submit" class="btn">
                Sign In
            </button>

            <div class="links">

                <button type="button" class="linkBtn" onclick="showForgot()">
                    Forgot Password?
                </button>

                <button type="button" class="linkBtn" onclick="showRegister()">
                    Sign Up
                </button>

            </div>

            <div class="message" id="loginMessage"></div>

        </form>

        <!-- REGISTER -->

        <form class="form" id="registerForm">

            <h2 class="title">REGISTER</h2>

            <div class="inputBox">
                <input type="email" id="registerEmail" placeholder="Masukkan Email" required>
            </div>

            <div class="inputBox">
                <input type="password" id="registerPassword" placeholder="Masukkan Password" required>
            </div>

            <div class="inputBox">
                <input type="password" id="registerConfirmPassword" placeholder="Masukkan Password Lagi" required>
            </div>

            <button type="submit" class="btn">
                Simpan Akun
            </button>

            <div class="links">

                <button type="button" class="linkBtn" onclick="showLogin()">
                    Sudah punya akun?
                </button>

            </div>

            <div class="message" id="registerMessage"></div>

        </form>

        <!-- FORGOT -->

        <form class="form" id="forgotForm">

            <h2 class="title">FORGOT</h2>

            <div class="inputBox">
                <input type="email" id="forgotEmail" placeholder="Masukkan Email Anda" required>
            </div>

            <button type="submit" class="btn">
                Reset Password
            </button>

            <div class="links">

                <button type="button" class="linkBtn" onclick="showLogin()">
                    Kembali Login
                </button>

            </div>

            <div class="message" id="forgotMessage"></div>

        </form>

    </div>

</div>

<!-- DASHBOARD -->

<div class="dashboard" id="dashboardPage">

    <!-- TOPBAR -->

    <div class="topbar">

        <div class="menuBtn" onclick="openSidebar()">
            ☰
        </div>

    </div>

    <!-- SIDEBAR -->

    <div class="sidebar" id="sidebar">

        <div class="closeBtn" onclick="closeSidebar()">
            ×
        </div>

        <div class="menu">

            <button onclick="showPage('dashboard')">
                Dashboard
            </button>

            <button onclick="showPage('profil')">
                Profil Akun
            </button>

            <button onclick="showPage('absensi')">
                Absensi
            </button>

            <button onclick="showPage('pengumuman')">
                Pengumuman
            </button>

            <button onclick="showPage('jadwal')">
                Jadwal Kerja
            </button>

            <button onclick="showPage('setting')">
                Setting
            </button>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>

    <!-- CONTENT -->

    <div class="content">

        <!-- DASHBOARD -->

        <div class="page active" id="dashboard">

    <div class="dashboardTitle">
        <h1>NOVA AI</h1>
        <p>Artificial Intelligence Assistant System</p>
    </div>

    <div class="dashboardGrid">

        <div class="aiCard">
            <h2>AI STATUS</h2>
            <span class="online"></span>
            <p>ONLINE</p>
        </div>

        <div class="aiCard">
            <h2>TOTAL CHAT</h2>
            <p>1,245</p>
        </div>

        <div class="aiCard">
            <h2>AI RESPONSE</h2>
            <p>0.2s</p>
        </div>

        <div class="aiCard">
            <h2>SERVER</h2>
            <p>ACTIVE</p>
        </div>

    </div>

    <div class="mainAiBox">

        <h2>AI Assistant</h2>

        <!-- CHAT -->

        <div class="chatBox">

            <div class="aiMessage">
                Halo, saya NOVA AI. Ada yang bisa saya bantu?
            </div>

        </div>

        <!-- INPUT -->

        <div class="inputAi">

            <input type="text" placeholder="Tanyakan sesuatu ke AI...">

            <button>
                SEND
            </button>

        </div>

    </div>

</div>

        <!-- PROFIL -->

        <div class="page" id="profil">
        </div>

        <!-- ABSENSI -->

        <div class="page" id="absensi">
        </div>

        <!-- PENGUMUMAN -->

        <div class="page" id="pengumuman">
        </div>

        <!-- JADWAL -->

        <div class="page" id="jadwal">
        </div>

        <!-- SETTING -->

        <div class="page" id="setting">
        </div>

    </div>

</div>

<script>

/* FORM */

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const forgotForm = document.getElementById("forgotForm");

/* SHOW LOGIN */

function showLogin(){

    loginForm.classList.add("active");

    registerForm.classList.remove("active");

    forgotForm.classList.remove("active");

}

/* SHOW REGISTER */

function showRegister(){

    registerForm.classList.add("active");

    loginForm.classList.remove("active");

    forgotForm.classList.remove("active");

}

/* SHOW FORGOT */

function showForgot(){

    forgotForm.classList.add("active");

    loginForm.classList.remove("active");

    registerForm.classList.remove("active");

}

/* REGISTER */

registerForm.addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("registerEmail").value;

    const password = document.getElementById("registerPassword").value;

    const confirmPassword = document.getElementById("registerConfirmPassword").value;

    const message = document.getElementById("registerMessage");

    if(password !== confirmPassword){

        message.innerHTML = "Password tidak sama!";
        message.classList.add("error");

        return;

    }

    localStorage.setItem("userEmail", email);

    localStorage.setItem("userPassword", password);

    message.classList.remove("error");

    message.innerHTML = "Akun berhasil dibuat!";

    setTimeout(() => {

        showLogin();

    },1000);

});

/* LOGIN */

loginForm.addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("loginEmail").value;

    const password = document.getElementById("loginPassword").value;

    const savedEmail = localStorage.getItem("userEmail");

    const savedPassword = localStorage.getItem("userPassword");

    const message = document.getElementById("loginMessage");

    if(email === savedEmail && password === savedPassword){

        message.classList.remove("error");

        message.innerHTML = "Login berhasil!";

        setTimeout(() => {

            document.getElementById("loginContainer").style.display = "none";

            document.getElementById("dashboardPage").style.display = "block";

            document.getElementById("profileEmail").innerHTML =
            "Email : " + savedEmail;

        },1000);

    }else{

        message.innerHTML = "Email atau password salah!";
        message.classList.add("error");

    }

});

/* FORGOT */

forgotForm.addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("forgotEmail").value;

    const savedEmail = localStorage.getItem("userEmail");

    const message = document.getElementById("forgotMessage");

    if(email === savedEmail){

    localStorage.removeItem("userPassword");

    /* KOSONGKAN INPUT */

    document.getElementById("loginEmail").value = "";

    document.getElementById("loginPassword").value = "";

    document.getElementById("forgotEmail").value = "";

    message.classList.remove("error");

    message.innerHTML = "Reset password berhasil!";

    setTimeout(() => {

        showLogin();

    },1500);

}else{

message.innerHTML = "Email tidak ditemukan!";  
    message.classList.add("error");  

     }

});

/* OPEN SIDEBAR */

function openSidebar(){

    document.getElementById("sidebar").classList.add("active");

}

/* CLOSE SIDEBAR */

function closeSidebar(){

    document.getElementById("sidebar").classList.remove("active");

}

/* SHOW PAGE */

function showPage(pageId){

    const pages = document.querySelectorAll('.page');

    pages.forEach(page => {

        page.classList.remove('active');

    });

    document.getElementById(pageId).classList.add('active');

    closeSidebar();

}


    /* AI CHAT */

const aiInput = document.querySelector(".inputAi input");

const aiButton = document.querySelector(".inputAi button");

const chatBox = document.querySelector(".chatBox");

/* API KEY */

const API_KEY = "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";

/* ENTER */

aiInput.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        sendMessage();

    }

});

/* BUTTON */

aiButton.addEventListener("click", sendMessage);

/* SEND MESSAGE */

async function sendMessage(){

    const text = aiInput.value.trim();

    if(text === "") return;

    /* USER MESSAGE */

    const userMessage = document.createElement("div");

    userMessage.style.background = "#00bcd4";

    userMessage.style.color = "black";

    userMessage.style.padding = "15px";

    userMessage.style.borderRadius = "15px";

    userMessage.style.marginTop = "15px";

    userMessage.style.marginLeft = "auto";

    userMessage.style.width = "fit-content";

    userMessage.style.maxWidth = "90%";

    userMessage.innerHTML = text;

    chatBox.appendChild(userMessage);

    aiInput.value = "";

    /* LOADING */

    const loading = document.createElement("div");

    loading.classList.add("aiMessage");

    loading.innerHTML = "NOVA AI sedang mengetik...";

    chatBox.appendChild(loading);

    chatBox.scrollTop = chatBox.scrollHeight;

    try{

        const response = await fetch(
"https://api.groq.com/openai/v1/chat/completions",
{

    method: "POST",

    headers: {

        "Content-Type": "application/json",

        "Authorization": `Bearer ${API_KEY}`

    },

    body: JSON.stringify({

        model: "llama-3.3-70b-versatile",

        messages: [

            {
                role: "system",
                content: "Kamu adalah NOVA AI, asisten AI pintar yang ramah dan membantu."
            },

            {
                role: "user",
                content: text
            }

        ]

    })

});

        const data = await response.json();

        loading.remove();

        const aiMessage = document.createElement("div");

        aiMessage.classList.add("aiMessage");

        if(data.choices){

            aiMessage.innerHTML =
            data.choices[0].message.content;

        }else{

            aiMessage.innerHTML =
            data.error?.message || "API ERROR";

        }

        chatBox.appendChild(aiMessage);

        chatBox.scrollTop = chatBox.scrollHeight;

    }

    catch(error){

        console.log(error);

        loading.innerHTML = "Error mengambil respon AI.";

    }

}


/* LOGOUT */

function logout(){

    document.getElementById("dashboardPage").style.display = "none";

    document.getElementById("loginContainer").style.display = "flex";

    /* KOSONGKAN INPUT LOGIN */

    document.getElementById("loginEmail").value = "";

    document.getElementById("loginPassword").value = "";

    document.getElementById("forgotEmail").value = "";

    showLogin();

    }

</script>

</body>
</html>
