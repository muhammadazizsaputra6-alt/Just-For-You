<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horror Game</title>

  <style>
    body{
      margin:0;
      background:black;
      color:red;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      overflow:hidden;
      font-family:Arial;
      flex-direction:column;
    }

    h1{
      font-size:50px;
      text-shadow:0 0 20px red;
      animation:flicker .2s infinite alternate;
    }

    p{
      color:white;
      margin-top:20px;
    }

    @keyframes flicker{
      from{
        opacity:0.5;
      }
      to{
        opacity:1;
      }
    }
  </style>
</head>

<body>

<h1>DONT LOOK BACK</h1>
<p>Game berhasil dibuka.</p>

<script>
setTimeout(()=>{
  alert("JUMPSCARE!");
},3000);
</script>

</body>
</html>
