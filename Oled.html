<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI OLED FACE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Arial;
    perspective:1200px;
}

/* background */

.bg{
    position:absolute;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at center,
    rgba(0,255,255,0.1),
    transparent 60%);
}

/* face */

.head{

    position:relative;

    width:400px;
    height:500px;

    border-radius:50%;

    background:
    linear-gradient(
    145deg,
    rgba(0,255,255,0.08),
    rgba(255,255,255,0.02));

    border:1px solid rgba(0,255,255,0.2);

    box-shadow:
    0 0 30px rgba(0,255,255,0.3),
    inset 0 0 50px rgba(0,255,255,0.08);

    backdrop-filter:blur(10px);

    transform-style:preserve-3d;

    transition:0.5s;
}

/* scanlines */

.head::before{

    content:"";

    position:absolute;
    inset:0;

    border-radius:50%;

    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 6px
    );

    pointer-events:none;
}

/* eyes */

.eyes{
    position:absolute;
    width:100%;
    top:150px;

    display:flex;
    justify-content:space-evenly;
}

.eye{

    position:relative;

    width:100px;
    height:100px;

    background:#00ffff;

    border-radius:50%;

    overflow:hidden;

    transition:0.4s;

    box-shadow:
    0 0 20px #00ffff,
    0 0 50px #00ffff;
}

.pupil{

    position:absolute;

    width:30px;
    height:30px;

    background:black;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);
}

/* mouth */

.mouth{

    position:absolute;

    bottom:120px;
    left:50%;

    transform:translateX(-50%);

    width:120px;
    height:40px;

    border-bottom:8px solid #00ffff;

    border-radius:0 0 100px 100px;

    transition:0.4s;

    box-shadow:
    0 0 15px #00ffff;
}

/* tears */

.tear{

    position:absolute;

    width:15px;
    height:40px;

    background:#4cc9ff;

    border-radius:20px;

    top:240px;

    opacity:0;

    animation:tearDrop 1s infinite;
}

.tear.left{
    left:105px;
}

.tear.right{
    right:105px;
}

@keyframes tearDrop{

    0%{
        transform:translateY(0);
        opacity:1;
    }

    100%{
        transform:translateY(40px);
        opacity:0;
    }

}

/* sleep bubble */

.bubble{

    position:absolute;

    width:30px;
    height:30px;

    border:4px solid #00ffff;

    border-radius:50%;

    right:110px;
    bottom:120px;

    opacity:0;

    animation:bubbleSleep 2s infinite;
}

@keyframes bubbleSleep{

    0%{
        transform:scale(0.5);
        opacity:0;
    }

    50%{
        transform:scale(1);
        opacity:1;
    }

    100%{
        transform:scale(1.5);
        opacity:0;
    }

}

/* buttons */

.controls{

    position:absolute;
    bottom:30px;

    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}

button{

    padding:12px 20px;

    border:none;
    border-radius:14px;

    background:#041d24;

    color:#00ffff;

    font-size:15px;

    cursor:pointer;

    transition:0.25s;

    box-shadow:
    0 0 10px rgba(0,255,255,0.2);
}

button:hover{

    transform:scale(1.08);

    background:#063844;

    box-shadow:
    0 0 20px #00ffff;
}

/* text */

.label{

    position:absolute;
    top:40px;

    color:#00ffff;

    font-size:22px;

    letter-spacing:5px;

    text-shadow:
    0 0 10px #00ffff;
}

/* mobile */

@media(max-width:600px){

    .head{
        width:300px;
        height:400px;
    }

    .eye{
        width:70px;
        height:70px;
    }

    .mouth{
        bottom:90px;
    }

    .tear.left{
        left:70px;
    }

    .tear.right{
        right:70px;
    }

}

/* semua CSS atas */

button:hover{

    transform:scale(1.08);

    background:#063844;

    box-shadow:
    0 0 20px #00ffff;
}


/* TAMBAHIN DI SINI */

@keyframes blinkAnim{

    0%,45%,47%,100%{
        transform:scaleY(1);
    }

    46%{
        transform:scaleY(0.05);
    }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="label">
    AI FACE SYSTEM
</div>

<div class="head" id="head">

    <div class="eyes">

        <div class="eye" id="leftEye">
            <div class="pupil"></div>
        </div>

        <div class="eye" id="rightEye">
            <div class="pupil"></div>
        </div>

    </div>

    <div class="mouth" id="mouth"></div>

    <div class="tear left" id="tearL"></div>
    <div class="tear right" id="tearR"></div>

    <div class="bubble" id="bubble"></div>

</div>

<div class="controls">

    <button onclick="happy()">😊 Senang</button>

    <button onclick="angry()">😠 Marah</button>

    <button onclick="sad()">😭 Nangis</button>

    <button onclick="sleep()">😴 Tidur</button>

    <button onclick="normal()">🤖 Normal</button>

</div>

<script>

const leftEye = document.getElementById("leftEye");
const rightEye = document.getElementById("rightEye");
const mouth = document.getElementById("mouth");

const tearL = document.getElementById("tearL");
const tearR = document.getElementById("tearR");

const bubble = document.getElementById("bubble");

/* reset */

function resetAll(){

    tearL.style.opacity="0";
    tearR.style.opacity="0";

    bubble.style.opacity="0";

    leftEye.style.height="100px";
    rightEye.style.height="100px";

    leftEye.style.background="#00ffff";
    rightEye.style.background="#00ffff";

    leftEye.style.borderRadius="50%";
    rightEye.style.borderRadius="50%";

    mouth.style.width="120px";
    mouth.style.height="40px";

    mouth.style.borderBottom="8px solid #00ffff";
}

/* happy */

function happy(){

    resetAll();

    mouth.style.width="180px";

    leftEye.style.transform="scaleY(0.8)";
    rightEye.style.transform="scaleY(0.8)";
}

/* angry */

function angry(){

    resetAll();

    leftEye.style.background="#ff003c";
    rightEye.style.background="#ff003c";

    leftEye.style.transform="rotate(-10deg)";
    rightEye.style.transform="rotate(10deg)";

    mouth.style.borderBottom="8px solid red";
}

/* crying */

function sad(){

    resetAll();

    tearL.style.opacity="1";
    tearR.style.opacity="1";

    mouth.style.width="90px";
    mouth.style.height="20px";

    mouth.style.borderRadius="100px 100px 0 0";
    mouth.style.borderTop="8px solid #00ffff";
    mouth.style.borderBottom="none";
}

/* sleep */

function sleep(){

    resetAll();

    leftEye.style.height="20px";
    rightEye.style.height="20px";

    bubble.style.opacity="1";

    mouth.style.width="70px";
}

/* normal */

function normal(){

    resetAll();

    /* balikin mulut */

    mouth.style.borderTop="none";
    mouth.style.borderBottom="8px solid #00ffff";

    /* balikin mata */

    leftEye.style.transform="";
    rightEye.style.transform="";

    leftEye.style.height="100px";
    rightEye.style.height="100px";

    /* hidupin animasi kedip */

    leftEye.style.animation = "blinkAnim 4s infinite";
    rightEye.style.animation = "blinkAnim 4s infinite";
    }

</script>

</body>
</html>
